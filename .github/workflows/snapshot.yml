name: Snapshot
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_sha == github.sha }}
    env:
      JAVA_OPTS: -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
      JVM_OPTS:  -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 0
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 11
    - name: Set up Gradle runtime
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 25
    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic
    - run: |
        set -euo pipefail
        current_main_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
        if [[ "$current_main_sha" != "$GITHUB_SHA" ]]; then
          echo "::notice::Skipping Snapshot publish because main has advanced."
          exit 0
        fi
        ./gradlew publishToSonatype --info --stacktrace
