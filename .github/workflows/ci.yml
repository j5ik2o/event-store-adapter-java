name: CI
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'version'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Run lint"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 11
      - name: Set up Gradle runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: ./gradlew spotlessCheck --info
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    env:
      JAVA_OPTS: -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
      JVM_OPTS:  -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
    strategy:
      matrix:
        java: [ 11, 17, 19 ]
    name: "Run tests with JDK ${{ matrix.java }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            ${{ matrix.java }}
      - name: Set up Gradle runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Run tests
        env:
          TEST_JAVA_VERSION: ${{ matrix.java }}
        run: ./gradlew test -PtestJavaVersion="$TEST_JAVA_VERSION" --info
  release-tools:
    name: Check release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Verify conformance data v1.0.0
        run: |
          python3 tools/conformance/manifest.py verify
          echo "61c26614dbbfba88eebce72cc1d2b0220218839e74dcfb64c19268f7ee2302ce  conformance/manifest.json" | sha256sum -c -
      - name: Test SemVer classification
        run: python3 -m unittest discover -s .github/tests -v
      - name: Check workflows with actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [lint, test, release-tools]
    if: always()
    steps:
      - name: Check CI results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RELEASE_TOOLS_RESULT: ${{ needs.release-tools.result }}
        run: |
          if [[ "$LINT_RESULT" != "success" || "$TEST_RESULT" != "success" || "$RELEASE_TOOLS_RESULT" != "success" ]]; then
            echo "CI did not succeed: lint=$LINT_RESULT, test=$TEST_RESULT, release-tools=$RELEASE_TOOLS_RESULT"
            exit 1
          fi
