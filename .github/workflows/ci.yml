name: CI
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'version'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Run lint"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 11
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.3
          arguments: spotlessCheck --info
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    env:
      JAVA_OPTS: -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
      JVM_OPTS:  -Xms2048M -Xmx2048M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
    strategy:
      matrix:
        java: [ 11, 17, 19 ] # LTS versions + latest version
    name: "Run tests with JDK ${{ matrix.java }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.3
          arguments: test --info
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [lint, test]
    if: always()
    steps:
      - name: Check CI results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$LINT_RESULT" != "success" || "$TEST_RESULT" != "success" ]]; then
            echo "CI did not succeed: lint=$LINT_RESULT, test=$TEST_RESULT"
            exit 1
          fi
